<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Website Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { background: #060913; color: white; font-family: 'Outfit', sans-serif; padding: 40px; }
    .container { max-width: 600px; margin: 0 auto; background: #0f172a; padding: 30px; border-radius: 16px; border: 1px solid #00f2fe; }
    h2 { margin-bottom: 20px; color: #00f2fe; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input[type="text"], textarea, input[type="file"] { width: 100%; padding: 12px; background: #060913; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; }
    button { background: linear-gradient(90deg, #00f2fe, #4facfe); color: black; border: none; padding: 14px 28px; font-weight: 900; border-radius: 8px; cursor: pointer; width: 100%; }
    #msg { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>GYM ADMIN PANEL</h2>
    <form id="adminForm">
      <div class="form-group">
        <label>Gym Name:</label>
        <input type="text" id="gymName" required>
      </div>
      <div class="form-group">
        <label>Hero Tagline (Headline):</label>
        <input type="text" id="heroTagline" required>
      </div>
      <div class="form-group">
        <label>Hero Description:</label>
        <textarea id="heroSubtext" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label>Top Announcement:</label>
        <input type="text" id="announcement" required>
      </div>
      <div class="form-group">
        <label>Change Main Hero Picture (Cloudinary):</label>
        <input type="file" id="gymPhoto" accept="image/*">
      </div>
      <button type="submit">UPDATE WEBSITE LIVE</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    async function loadData() {
      const res = await fetch('/api/content');
      const { data } = await res.json();
      document.getElementById('gymName').value = data.gymName;
      document.getElementById('heroTagline').value = data.heroTagline;
      document.getElementById('heroSubtext').value = data.heroSubtext;
      document.getElementById('announcement').value = data.announcement;
    }

    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('msg').innerText = "Uploading & updating...";

      const formData = new FormData();
      formData.append('gymName', document.getElementById('gymName').value);
      formData.append('heroTagline', document.getElementById('heroTagline').value);
      formData.append('heroSubtext', document.getElementById('heroSubtext').value);
      formData.append('announcement', document.getElementById('announcement').value);
      
      const file = document.getElementById('gymPhoto').files[0];
      if(file) formData.append('gymPhoto', file);

      const res = await fetch('/api/admin/update', { method: 'POST', body: formData });
      const data = await res.json();
      if(data.success) {
        document.getElementById('msg').innerText = "✅ Website Updated Successfully!";
      } else {
        document.getElementById('msg').innerText = "❌ Error updating site.";
      }
    });

    loadData();
  </script>
</body>
</html>
